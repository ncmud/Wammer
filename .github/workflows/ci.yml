name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --strict --reporter github-actions-logging src/

  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.0.app/Contents/Developer

      - name: Install tools
        run: brew install tuist xcbeautify

      - name: Generate project
        run: tuist generate --no-open

      - name: Build
        run: |
          xcodebuild build \
            -workspace Wammer.xcworkspace \
            -scheme Wammer \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -skipPackagePluginValidation \
            | xcbeautify

  build-visionos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.0.app/Contents/Developer

      - name: Install tools
        run: brew install tuist xcbeautify

      - name: Generate project
        run: tuist generate --no-open

      - name: Build (visionOS)
        run: |
          xcodebuild build \
            -workspace Wammer.xcworkspace \
            -scheme Wammer \
            -destination 'platform=visionOS Simulator,name=Apple Vision Pro' \
            -skipPackagePluginValidation \
            | xcbeautify

  test:
    runs-on: macos-26
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.0.app/Contents/Developer

      - name: Install tools
        run: brew install tuist xcbeautify

      - name: Generate project
        run: tuist generate --no-open

      - name: Test
        run: |
          xcodebuild test \
            -workspace Wammer.xcworkspace \
            -scheme MRTests \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -skipPackagePluginValidation \
            | xcbeautify

  analyze:
    runs-on: macos-26
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.0.app/Contents/Developer

      - name: Install tools
        run: brew install tuist xcbeautify

      - name: Generate project
        run: tuist generate --no-open

      - name: Analyze
        run: |
          xcodebuild analyze \
            -workspace Wammer.xcworkspace \
            -scheme Wammer \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -skipPackagePluginValidation \
            | xcbeautify
