included:
  - src/

excluded:
  - Vendored/
  - Derived/

disabled_rules:
  - redundant_objc_attribute
  - type_body_length
  - line_length

opt_in_rules:
  - trailing_comma

trailing_comma:
  mandatory_comma: true

identifier_name:
  min_length: 1

file_length:
  warning: 500
  error: 1000

cyclomatic_complexity:
  warning: 15
  error: 25
